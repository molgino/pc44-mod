name: Bug report / Fehler melden
description: The sequencer or building the firmware does not work.
labels: [bug]
body:
  - type: input
    id: fw
    attributes:
      label: Original firmware and pc44-mod version
      placeholder: e.g. PC44 V01.01, commit 458c2e4
    validations: {required: true}
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Steps to reproduce; for clock problems, name the connected device.
    validations: {required: true}
